<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Translit PRO</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#121212;
    color:white;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.toolbar{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:20px;
}

button{
    border:none;
    border-radius:8px;
    padding:12px 18px;
    cursor:pointer;
    background:#1976d2;
    color:white;
    font-size:15px;
}

button:hover{
    opacity:.9;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

textarea{
    width:100%;
    height:350px;
    background:#1e1e1e;
    color:white;
    border:1px solid #333;
    border-radius:12px;
    padding:15px;
    resize:none;
    font-size:18px;
}

.keyboard{
    margin-top:20px;
}
.hebrew{
    direction: rtl;
}

.arabic{
    direction: rtl;
}
.keyboard h3{
    text-align:center;
}

.keys{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
}

.key{
    min-width:40px;
}

@media(max-width:800px){

    .row{
        grid-template-columns:1fr;
    }

    textarea{
        height:250px;
    }
}

</style>

</head>

<body>

<div class="container">

<h1>🚀 Translit PRO</h1>

<div class="toolbar">
    <select id="mode">
    <option value="tr_ru">Translit → Русский</option>
    <option value="ru_tr">Русский → Translit</option>
    <option value="he_ru">עברית → Русский</option>
    <option value="he_lat">עברית → Latin</option>
    <option value="lat_he">Latin → עברית</option>
<option value="he_lat">עברית → Latin</option>
<option value="lat_he">Latin → עברית</option>

<option value="ar_lat">العربية → Latin</option>
<option value="lat_ar">Latin → العربية</option>
        <option value="ar_he">العربية → עברית</option>
<option value="he_ar">עברית → العربية</option>

</select>
    <br/>
<button onclick="translitToRussian()">Translit → Русский</button>
<button onclick="russianToTranslit()">Русский → Translit</button>
<button onclick="hebrewToRussian()">עברית → Русский</button>
    <button onclick="insertChar(' ')">␣ Пробел</button>
<button onclick="backspace()">⌫ Backspace</button>
<button onclick="insertChar('\n')">↵ Enter</button>
<button onclick="swapText()">⇄ Поменять</button>
<button onclick="copyResult()">Копировать</button>
<button onclick="clearAll()">Очистить</button>
</div>

<div class="row">

<div>
<h3>Исходный текст</h3>
<textarea id="source"></textarea>
</div>

<div>
<h3>Результат</h3>
<textarea id="result"></textarea>
</div>

</div>

<div class="keyboard">

<h3>Русская клавиатура</h3>

<div class="keys" id="ruKeys"></div>

<h3 style="margin-top:20px;">עברית</h3>

<div class="keys" id="heKeys"></div>
<h3>English</h3>
<div class="keys" id="enKeys"></div>
    <h3>العربية</h3>
<div class="keys" id="arKeys"></div>
</div>

</div>

<script>

const source = document.getElementById("source");
const result = document.getElementById("result");

const translitPairs = [

["Shch","Щ"],["SCH","Щ"],["sch","щ"],

["Yo","Ё"],["YO","Ё"],["yo","ё"],
["Zh","Ж"],["ZH","Ж"],["zh","ж"],
["Kh","Х"],["KH","Х"],["kh","х"],
["Ts","Ц"],["TS","Ц"],["ts","ц"],
["Ch","Ч"],["CH","Ч"],["ch","ч"],
["Sh","Ш"],["SH","Ш"],["sh","ш"],
["Yu","Ю"],["YU","Ю"],["yu","ю"],
["Ya","Я"],["YA","Я"],["ya","я"],

["A","А"],["a","а"],
["B","Б"],["b","б"],
["V","В"],["v","в"],
["G","Г"],["g","г"],
["D","Д"],["d","д"],
["E","Е"],["e","е"],
["Z","З"],["z","з"],

["J","Й"],["j","й"],

["L","Л"],["l","л"],
["M","М"],["m","м"],
["N","Н"],["n","н"],
["O","О"],["o","о"],
["P","П"],["p","п"],
["R","Р"],["r","р"],
["S","С"],["s","с"],
["T","Т"],["t","т"],
["U","У"],["u","у"],
["F","Ф"],["f","ф"],
["Y","Ы"],["y","ы"],

["''","Ъ"],
["'","Ь"]
];

function translitToRussian(){

    let txt = source.value;

    translitPairs
      .sort((a,b)=>b[0].length-a[0].length)
      .forEach(pair=>{
          txt = txt.split(pair[0]).join(pair[1]);
      });

    result.value = txt;
}

function russianToTranslit(){

    let out = "";

    for(let ch of source.value){
        out += ruToLat[ch] || ch;
    }

    result.value = out;
}

    function arabicToLatin(){

    let out = "";

        out += arabicLatinMap[ch] || ch;
    }

    result.value = out;
}
    const latinArabicMap = [

    function latinToArabic(){

    let txt = source.value.toLowerCase();

    latinArabicMap
        .sort((a,b)=>b[0].length-a[0].length)
        .forEach(([from,to]) => {
            txt = txt.split(from).join(to);
        });

    result.value = txt;
}
    const arabicHebrewMap = {

function arabicToHebrew(){
if(mode.includes("he") || mode.includes("ar")){
    source.dir = "rtl";
    result.dir = "rtl";
}
else{
    source.dir = "ltr";
    result.dir = "ltr";
}
    let out = "";

    for(let ch of source.value){
        out += arabicHebrewMap[ch] || ch;
    }

    result.value = out;
}

const hebrewArabicMap = {

function hebrewToArabic(){

    let out = "";

    for(let ch of source.value){
        out += hebrewArabicMap[ch] || ch;
    }

    result.value = out;
}
   const latinHebrewMap = [
    ["sh","ש"],
    ["ch","צ׳"],
    ["kh","ח"],
    ["ts","צ"],
    ["tz","צ"],
    ["ph","פ"],
    ["th","ת"],
    ["a","א"],

    ["u","ו"],
    ["v","ו"],
    ["w","ו"],
    ["x","קס"],
    ["y","י"],
    ["z","ז"]
];
    function latinToHebrew(){

    let txt = source.value.toLowerCase();

    latinHebrewMap
        .sort((a,b)=>b[0].length-a[0].length)
        .forEach(pair=>{
            txt = txt.split(pair[0]).join(pair[1]);
        });

    result.value = txt;
}
    function hebrewToLatin(){

    let out = "";

    for(let ch of source.value){
        out += hebrewLatinMap[ch] || ch;
    }

    result.value = out;
}
function hebrewToRussian(){

    let out = "";

    for(let ch of source.value){
        out += hebrewMap[ch] || ch;
    }

    result.value = out;
}
function insertChar(ch){

    source.value += ch;

    autoConvert();

    source.focus();
}

function backspace(){

    source.value =
        source.value.slice(0,-1);

    autoConvert();

    source.focus();
}
function swapText(){

    let a = source.value;

    source.value = result.value;
    result.value = a;

    autoConvert();
}

function copyResult(){

    navigator.clipboard.writeText(result.value);
}

function clearAll(){

    source.value="";
    result.value="";
}

const ruLetters =
"ЙЦУКЕНГШЩЗХЪФЫВАПРОЛДЖЭЯЧСМИТЬБЮ".split("");

const heLetters =
"אבגדהוזחטיכלמנסעפצקרשת".split("");
const enLetters =
"QWERTYUIOPASDFGHJKLZXCVBNM".split("");
const arLetters =
"ضصثقفغعهخحجدشسيبلاتنمكطئءؤرﻻىةوزظ".split("");


function buildKeyboard(id,letters){

    const div = document.getElementById(id);

    letters.forEach(letter=>{

        const btn=document.createElement("button");

        btn.className="key";
        btn.textContent=letter;

       btn.onclick=()=>{

    source.value += letter;

    autoConvert();

    source.focus();
};

        div.appendChild(btn);

    });
}

buildKeyboard("ruKeys",ruLetters);
buildKeyboard("heKeys",heLetters);
buildKeyboard("enKeys",enLetters);
    buildKeyboard("arKeys", arLetters);
source.addEventListener("input", autoConvert);
document
.getElementById("mode")
.addEventListener("change", autoConvert);
function autoConvert() {

    const mode = document.getElementById("mode").value;
    if(mode === "ar_he"){
    arabicToHebrew();
}

if(mode === "he_ar"){
    hebrewToArabic();
}
    if(mode === "ar_lat"){
    arabicToLatin();
}

if(mode === "he_lat"){
    hebrewToLatin();
}

if(mode === "lat_he"){
    latinToHebrew();
}

if(mode === "ar_lat"){
    arabicToLatin();
}

if(mode === "lat_ar"){
    latinToArabic();
}

if(mode === "lat_he"){
    latinToHebrew();
}
    if(mode === "tr_ru"){
        translitToRussian();
    }

    if(mode === "ru_tr"){
        russianToTranslit();
    }

    if(mode === "he_ru"){
        hebrewToRussian();
    }
    if(mode.includes("he")){
    source.dir = "rtl";
    result.dir = "rtl";
}
else if(mode.includes("ar")){
    source.dir = "rtl";
    result.dir = "rtl";
}
else{
    source.dir = "ltr";
    result.dir = "ltr";
}
}
</script>

</html>
