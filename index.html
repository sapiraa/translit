<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Translit</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Segoe UI,Arial,sans-serif;
    background:#121212;
    color:#fff;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    text-align:center;
}

.row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

textarea{
    width:100%;
    height:450px;
    resize:none;
    background:#1e1e1e;
    color:white;
    border:1px solid #333;
    border-radius:12px;
    padding:15px;
    font-size:18px;
}

.controls{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin:20px 0;
}

button{
    background:#1976d2;
    color:white;
    border:none;
    border-radius:8px;
    padding:12px 20px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

@media(max-width:800px){
    .row{
        grid-template-columns:1fr;
    }
}
</style>
</head>
<body>

<div class="container">

<h1>🚀 Translit</h1>

<div class="controls">
    <button onclick="copyRussian()">Копировать русский</button>
    <button onclick="copyLatin()">Копировать транслит</button>
    <button onclick="clearAll()">Очистить</button>
</div>

<div class="row">

<div>
<h3>Транслит</h3>
<textarea
id="latin"
placeholder="privet kak dela"></textarea>
</div>

<div>
<h3>Русский</h3>
<textarea
id="russian"
placeholder="привет как дела"></textarea>
</div>

</div>

</div>

<script>

const latinToRussian = [
["sch","щ"],
["sh","ш"],
["ch","ч"],
["zh","ж"],
["yo","ё"],
["yu","ю"],
["ya","я"],
["ts","ц"],
["a","а"],["b","б"],["v","в"],["g","г"],
["d","д"],["e","е"],["z","з"],["i","и"],
["j","й"],["k","к"],["l","л"],["m","м"],
["n","н"],["o","о"],["p","п"],["r","р"],
["s","с"],["t","т"],["u","у"],["f","ф"],
["h","х"],["y","ы"],["c","к"],["w","в"],
["q","к"]
];

const russianToLatin = {
"А":"A","Б":"B","В":"V","Г":"G","Д":"D",
"Е":"E","Ё":"Yo","Ж":"Zh","З":"Z","И":"I",
"Й":"J","К":"K","Л":"L","М":"M","Н":"N",
"О":"O","П":"P","Р":"R","С":"S","Т":"T",
"У":"U","Ф":"F","Х":"Kh","Ц":"Ts","Ч":"Ch",
"Ш":"Sh","Щ":"Sch","Ъ":"","Ы":"Y","Ь":"",
"Э":"E","Ю":"Yu","Я":"Ya",

"а":"a","б":"b","в":"v","г":"g","д":"d",
"е":"e","ё":"yo","ж":"zh","з":"z","и":"i",
"й":"j","к":"k","л":"l","м":"m","н":"n",
"о":"o","п":"p","р":"r","с":"s","т":"t",
"у":"u","ф":"f","х":"kh","ц":"ts","ч":"ch",
"ш":"sh","щ":"sch","ъ":"","ы":"y","ь":"",
"э":"e","ю":"yu","я":"ya"
};

const latin = document.getElementById('latin');
const russian = document.getElementById('russian');

let lock = false;

latin.addEventListener('input', () => {
    if(lock) return;

    lock = true;

    let text = latin.value.toLowerCase();

    for(const [a,b] of latinToRussian){
        text = text.split(a).join(b);
    }

    russian.value = text;

    lock = false;
});

russian.addEventListener('input', () => {
    if(lock) return;

    lock = true;

    let result = '';

    for(let ch of russian.value){
        result += russianToLatin[ch] || ch;
    }

    latin.value = result;

    lock = false;
});

function copyRussian(){
    navigator.clipboard.writeText(russian.value);
}

function copyLatin(){
    navigator.clipboard.writeText(latin.value);
}

function clearAll(){
    latin.value='';
    russian.value='';
}

</script>

</body>
</html>
